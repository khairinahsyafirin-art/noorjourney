<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Journey - Perjalanan Ibadahmu</title>
    
    <meta name="description" content="Aplikasi pendamping ibadah harian untuk melacak sholat, membaca Al-Quran, mengelola siklus haid, dan bersedekah">
    <meta name="theme-color" content="#012248">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noor Journey">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23012248;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23024073;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='192' height='192' fill='url(%23grad)' rx='40'/%3E%3Ctext x='96' y='120' font-size='80' text-anchor='middle' fill='%23d1b48c' font-family='Arial, sans-serif' font-weight='bold'%3E✨%3C/text%3E%3C/svg%3E">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E✨%3C/text%3E%3C/svg%3E">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #012248 0%, #024073 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 428px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #012248 0%, #024073 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Content */
        .content {
            padding: 20px;
            padding-bottom: 100px;
        }

        /* Page */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Countdown Timer */
        .countdown-card {
            background: linear-gradient(135deg, #012248 0%, #024073 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .countdown-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .countdown-timer {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .countdown-next {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Journey Stats Card */
        .journey-card {
            background: white;
            border: 2px solid #012248;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .streak-section {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .streak-number {
            font-size: 48px;
            font-weight: bold;
            color: #012248;
        }

        .streak-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .weekly-dots {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .day-dot {
            text-align: center;
            flex: 1;
        }

        .day-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
        }

        .dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 0 auto;
            background: #e0e0e0;
        }

        .dot.completed {
            background: #d1b48c;
        }

        .weekly-summary {
            font-size: 14px;
            color: #333;
        }

        .weekly-summary div {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .weekly-summary div:before {
            content: "•";
            position: absolute;
            left: 5px;
            color: #d1b48c;
        }

        /* Prayer List */
        .prayer-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #012248;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title:before {
            content: "";
            width: 4px;
            height: 20px;
            background: #d1b48c;
            margin-right: 10px;
        }

        .prayer-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .prayer-info {
            flex: 1;
        }

        .prayer-name {
            font-size: 16px;
            font-weight: 600;
            color: #012248;
            margin-bottom: 3px;
        }

        .prayer-time {
            font-size: 14px;
            color: #666;
        }

        .check-circle {
            width: 30px;
            height: 30px;
            border: 2px solid #d1b48c;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }

        .check-circle.checked {
            background: #d1b48c;
        }

        .check-circle.checked:after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
        }

        /* Activities */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .activity-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .activity-item.checked {
            background: #f5f1e8;
            border-color: #d1b48c;
        }

        .activity-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .activity-name {
            font-size: 13px;
            color: #333;
        }

        /* Surah List - UPDATED: Removed Max Height */
        .surah-list {
            max-height: none; 
            overflow-y: visible;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #012248;
            border-bottom-color: #d1b48c;
            font-weight: 600;
        }

        .surah-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .surah-item:hover {
            background: #f9f9f9;
        }

        .surah-number {
            width: 40px;
            height: 40px;
            border: 2px solid #d1b48c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #012248;
            margin-right: 15px;
        }

        .surah-info {
            flex: 1;
        }

        .surah-name {
            font-size: 16px;
            font-weight: 600;
            color: #012248;
            margin-bottom: 3px;
        }

        .surah-meta {
            font-size: 13px;
            color: #666;
        }

        .surah-arabic {
            font-size: 20px;
            color: #012248;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 428px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            cursor: pointer;
            color: #999;
        }

        .nav-item.active {
            color: #012248;
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 3px;
        }

        .nav-label {
            font-size: 11px;
        }

        /* Ayah View */
        .ayah-list {
            padding: 10px 0;
        }

        .ayah-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .ayah-arabic {
            font-size: 24px;
            line-height: 1.8;
            text-align: right;
            color: #012248;
            margin-bottom: 15px;
            font-family: 'Traditional Arabic', serif;
        }

        .ayah-translation {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }

        .back-button {
            background: #012248;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="berandaPage" class="page active">
            <div class="header">
                <h1>✨ Noor Journey ✨</h1>
                <p>Perjalanan Ibadahmu Dimulai di Sini</p>
            </div>

            <div class="content">
                <div class="countdown-card">
                    <div class="countdown-label">Waktu Menuju</div>
                    <div class="countdown-timer" id="countdownTimer">00:00:00</div>
                    <div class="countdown-next" id="nextPrayerName">Shubuh</div>
                </div>

                <div class="journey-card">
                    <div class="streak-section">
                        <div class="streak-number" id="streakNumber">0</div>
                        <div class="streak-label">🔥 Hari Berturut-turut</div>
                    </div>
                    <div class="weekly-dots" id="weeklyDots"></div>
                    <div class="weekly-summary" id="weeklySummary"></div>
                </div>

                <div class="prayer-section">
                    <div class="section-title">Sholat Wajib</div>
                    <div id="wajibPrayerList"></div>
                </div>

                <div class="prayer-section">
                    <div class="section-title">Aktivitas Harian</div>
                    <div class="activity-grid" id="activityGrid"></div>
                </div>
            </div>
        </div>

        <div id="quranPage" class="page">
            <div class="header">
                <h1>📖 Al-Quran</h1>
                <p>Bacalah dengan Hati yang Khusyuk</p>
            </div>
            <div class="content">
                <div class="search-box">
                    <input type="text" id="surahSearch" placeholder="🔍 Cari surah...">
                </div>
                <div id="surahListContainer" class="surah-list"></div>
            </div>
        </div>

        <div id="surahDetailPage" class="page">
            <div class="header">
                <h1 id="surahDetailTitle">Al-Fatihah</h1>
                <p id="surahDetailMeta">7 Ayat</p>
            </div>
            <div class="content">
                <button class="back-button" onclick="backToSurahList()">← Kembali</button>
                <div id="ayahListContainer" class="ayah-list"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showPage('berandaPage')">
                <div class="nav-icon">🏠</div>
                <div class="nav-label">Beranda</div>
            </div>
            <div class="nav-item" onclick="showPage('quranPage')">
                <div class="nav-icon">📖</div>
                <div class="nav-label">Al-Quran</div>
            </div>
        </div>
    </div>

    <script>
        // ========== DATA ==========
        const SURAH_DATA = [
            { number: 1, name: "Al-Fatihah", arabic: "الفاتحة", type: "Makkiyah", ayahs: 7 },
            { number: 2, name: "Al-Baqarah", arabic: "البقرة", type: "Madaniyah", ayahs: 286 },
            { number: 3, name: "Ali 'Imran", arabic: "آل عمران", type: "Madaniyah", ayahs: 200 },
            { number: 18, name: "Al-Kahf", arabic: "الكهف", type: "Makkiyah", ayahs: 110 },
            { number: 36, name: "Yasin", arabic: "يس", type: "Makkiyah", ayahs: 83 },
            { number: 67, name: "Al-Mulk", arabic: "الملك", type: "Makkiyah", ayahs: 30 }
        ];

        // ========== CORE FUNCTIONS ==========
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
        }

        // Quran API with Fallback
        async function fetchSurahDetail(id) {
            try {
                const res = await fetch(`https://equran.id/api/v2/surat/${id}`);
                const json = await res.json();
                return json.data.ayat;
            } catch (e) {
                console.warn("API Utama gagal, mencoba backup...");
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/id.indonesian`);
                const json = await res.json();
                return json.data.ayahs.map(a => ({
                    nomorAyat: a.numberInSurah,
                    teksArab: a.text,
                    teksIndonesia: a.text // Note: adjust based on actual cloud API response
                }));
            }
        }

        async function openSurah(id) {
            const surah = SURAH_DATA.find(s => s.number === id);
            document.getElementById('surahDetailTitle').textContent = surah.name;
            showPage('surahDetailPage');
            
            const container = document.getElementById('ayahListContainer');
            container.innerHTML = '<p style="text-align:center">Memuat ayat...</p>';
            
            const ayahs = await fetchSurahDetail(id);
            container.innerHTML = ayahs.map(a => `
                <div class="ayah-item">
                    <div class="ayah-arabic">${a.teksArab}</div>
                    <div class="ayah-translation"><strong>${a.nomorAyat}.</strong> ${a.teksIndonesia}</div>
                </div>
            `).join('');
        }

        function backToSurahList() {
            showPage('quranPage');
        }

        function renderSurahList() {
            const container = document.getElementById('surahListContainer');
            container.innerHTML = SURAH_DATA.map(s => `
                <div class="surah-item" onclick="openSurah(${s.number})">
                    <div class="surah-number">${s.number}</div>
                    <div class="surah-info">
                        <div class="surah-name">${s.name}</div>
                        <div class="surah-meta">${s.type} • ${s.ayahs} Ayat</div>
                    </div>
                    <div class="surah-arabic">${s.arabic}</div>
                </div>
            `).join('');
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderSurahList();
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js').then(() => {
                    console.log('SW Registered v2.1.0');
                });
            }
        });
    </script>
</body>
</html>
