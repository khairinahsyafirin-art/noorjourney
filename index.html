<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Journey - Ibadah Harian</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #012248;
            --secondary: #d1b48c;
            --bg-light: #f8f9fa;
            --text-dark: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container { max-width: 428px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        /* Header Premium */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #024073 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        /* Countdown Card */
        .card-timer {
            background: white;
            margin: -30px 20px 20px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .timer-val { font-size: 32px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }

        /* Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 428px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            padding: 12px 0;
            border-top: 1px solid #eee;
            z-index: 1000;
        }

        .nav-item { flex: 1; text-align: center; color: #b2bec3; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }

        /* Content Pages */
        .page { display: none; padding: 20px; padding-bottom: 100px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Prayer Items */
        .prayer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 12px;
            border: 1px solid #f1f2f6;
        }

        .check-btn {
            width: 28px;
            height: 28px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-btn.active { background: var(--secondary); color: white; }

        /* Quran List */
        .surah-card {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .surah-num {
            width: 35px;
            height: 35px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-right: 15px;
        }

        /* Ayah Text */
        .ayah-box { padding: 20px; border-bottom: 1px solid #eee; }
        .arabic { font-size: 28px; text-align: right; color: var(--primary); margin-bottom: 15px; line-height: 2; }
    </style>
</head>
<body>

<div class="container">
    <div id="beranda" class="page active">
        <div class="header">
            <h2 style="font-weight: 800;">Noor Journey</h2>
            <p style="opacity: 0.8; font-size: 13px;">Sudahkah kamu bersyukur hari ini?</p>
        </div>
        
        <div class="card-timer">
            <p style="font-size: 12px; color: #636e72; margin-bottom: 5px;">Waktu Menuju <span id="next-prayer-name">Shubuh</span></p>
            <div class="timer-val" id="timer-display">00:00:00</div>
        </div>

        <h3 style="margin-bottom: 15px; font-size: 16px;">Jurnal Sholat</h3>
        <div id="prayer-list"></div>
    </div>

    <div id="quran" class="page">
        <h2 style="color: var(--primary); margin-bottom: 20px;">Al-Quran</h2>
        <div id="surah-container"></div>
    </div>

    <div id="surah-detail" class="page">
        <button onclick="changeTab('quran')" style="border:none; background:none; color: var(--primary); font-weight:bold; margin-bottom:20px;">← Kembali</button>
        <h2 id="detail-title"></h2>
        <div id="ayah-container"></div>
    </div>

    <div id="haid" class="page">
        <h2 style="color: var(--primary); margin-bottom: 20px;">Pelacak Haid</h2>
        <div style="background: white; padding: 20px; border-radius: 20px; text-align:center; border: 1px solid #eee;">
            <p>Fitur Kalender Sedang Disinkronkan</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="changeTab('beranda')"><span class="nav-icon">🏠</span>Beranda</div>
        <div class="nav-item" onclick="changeTab('quran')"><span class="nav-icon">📖</span>Quran</div>
        <div class="nav-item" onclick="changeTab('haid')"><span class="nav-icon">🌙</span>Haid</div>
    </nav>
</div>

<script>
    const prayers = [
        { id: 'shubuh', name: 'Shubuh', time: '04:35' },
        { id: 'dzuhur', name: 'Dzuhur', time: '12:05' },
        { id: 'ashar', name: 'Ashar', time: '15:15' },
        { id: 'maghrib', name: 'Maghrib', time: '18:10' },
        { id: 'isya', name: 'Isya', time: '19:20' }
    ];

    function changeTab(tabId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        const activeNav = Array.from(document.querySelectorAll('.nav-item')).find(n => n.innerText.toLowerCase().includes(tabId.replace('beranda', 'beranda')));
        if(activeNav) activeNav.classList.add('active');
    }

    function renderPrayers() {
        const container = document.getElementById('prayer-list');
        container.innerHTML = prayers.map(p => `
            <div class="prayer-row">
                <div>
                    <div style="font-weight:600;">${p.name}</div>
                    <div style="font-size:12px; color:#b2bec3;">Pukul ${p.time}</div>
                </div>
                <div class="check-btn" onclick="this.classList.toggle('active')">✓</div>
            </div>
        `).join('');
    }

    async function loadSurah() {
        const res = await fetch('https://equran.id/api/v2/surat');
        const data = await res.json();
        const container = document.getElementById('surah-container');
        container.innerHTML = data.data.map(s => `
            <div class="surah-card" onclick="viewSurah(${s.nomor})">
                <div class="surah-num">${s.nomor}</div>
                <div style="flex:1">
                    <div style="font-weight:600;">${s.namaLatin}</div>
                    <div style="font-size:11px; color:#b2bec3;">${s.arti} • ${s.jumlahAyat} Ayat</div>
                </div>
                <div style="font-size:20px; color:var(--primary);">${s.nama}</div>
            </div>
        `).join('');
    }

    async function viewSurah(no) {
        changeTab('surah-detail');
        const container = document.getElementById('ayah-container');
        container.innerHTML = '<p style="text-align:center; padding:50px;">Memuat ayat...</p>';
        
        try {
            const res = await fetch(`https://equran.id/api/v2/surat/${no}`);
            const data = await res.json();
            document.getElementById('detail-title').innerText = data.data.namaLatin;
            container.innerHTML = data.data.ayat.map(a => `
                <div class="ayah-box">
                    <div class="arabic">${a.teksArab}</div>
                    <div style="font-size:14px; color:#636e72;">${a.nomorAyat}. ${a.teksIndonesia}</div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = '<p>Gagal memuat ayat. Coba lagi nanti.</p>';
        }
    }

    // Timer sederhana
    setInterval(() => {
        const now = new Date();
        document.getElementById('timer-display').innerText = now.toLocaleTimeString('id-ID');
    }, 1000);

    // Init
    window.onload = () => {
        renderPrayers();
        loadSurah();
    };
</script>

</body>
</html>
