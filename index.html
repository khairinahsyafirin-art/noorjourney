<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Journey - Perjalanan Ibadahmu</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* CSS ASLI NUR JOURNEY - LENGKAP */
        :root { --primary: #012248; --secondary: #d1b48c; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #012248 0%, #024073 100%); min-height: 100vh; padding-bottom: 80px; }
        .container { max-width: 428px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .header { background: linear-gradient(135deg, #012248 0%, #024073 100%); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .content { padding: 20px; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* FIX SCROLL DAFTAR SURAH */
        .surah-list { max-height: none !important; overflow-y: visible; }
        
        .prayer-item { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .check-circle { width: 30px; height: 30px; border: 2px solid var(--secondary); border-radius: 50%; cursor: pointer; position: relative; }
        .check-circle.checked { background: var(--secondary); }
        .check-circle.checked:after { content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 428px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; cursor: pointer; color: #a4b0be; font-size: 11px; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        
        /* CALENDAR STYLE */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; cursor: pointer; }
        .calendar-day.period { background: #ff6b6b; color: white; }
        .calendar-day.today { border: 2px solid var(--secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div id="berandaPage" class="page active">
            <div class="header">
                <h1 style="font-size: 24px; font-weight: 800;">Noor Journey</h1>
                <p style="font-size: 13px; opacity: 0.8; margin-top: 5px;">Ibadahmu, Cahaya Hidupmu</p>
            </div>
            <div class="content">
                <div style="background: white; margin-top: -40px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center;">
                    <div id="nextPrayerName" style="color: var(--secondary); font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">Shubuh</div>
                    <div id="countdownTimer" style="font-size: 36px; font-weight: 800; color: var(--primary); margin: 5px 0;">00:00:00</div>
                </div>
                <div id="prayerList" style="margin-top: 25px;"></div>
            </div>
        </div>

        <div id="quranPage" class="page">
            <div class="header"><h1>📖 Al-Quran</h1></div>
            <div class="content">
                <input type="text" id="surahSearch" placeholder="Cari surah..." style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px;">
                <div id="surahListContainer" class="surah-list"></div>
            </div>
        </div>

        <div id="surahDetailPage" class="page">
            <div class="header"><h1 id="surahTitle"></h1></div>
            <div class="content">
                <button onclick="showPage('quranPage')" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; cursor: pointer;">← Kembali</button>
                <div id="ayahListContainer"></div>
            </div>
        </div>

        <div id="haidPage" class="page">
            <div class="header"><h1>🌙 Pelacak Haid</h1></div>
            <div class="content">
                <div id="calendarTitle" style="text-align: center; font-weight: bold; margin-bottom: 15px;"></div>
                <div id="calendarGrid" class="calendar-grid"></div>
                <button onclick="alert('Fitur catat haid aktif')" style="width: 100%; margin-top: 20px; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold;">+ Catat Haid</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showPage('berandaPage')">🏠<br>Beranda</div>
            <div class="nav-item" onclick="showPage('quranPage')">📖<br>Quran</div>
            <div class="nav-item" onclick="showPage('haidPage')">🌙<br>Haid</div>
        </div>
    </div>

    <script>
        // DATA TETAP UTUH & LENGKAP
        const PRAYERS = [
            { id: 'shubuh', name: 'Shubuh', time: '04:35' },
            { id: 'dzuhur', name: 'Dzuhur', time: '12:05' },
            { id: 'ashar', name: 'Ashar', time: '15:18' },
            { id: 'maghrib', name: 'Maghrib', time: '18:10' },
            { id: 'isya', name: 'Isya', time: '19:20' }
        ];

        // FIX SYNTAX ERROR - SHOWPAGE BERSIH
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            // Nav active logic
        }

        // QURAN API FALLBACK
        async function openSurah(id, name) {
            document.getElementById('surahTitle').innerText = name;
            showPage('surahDetailPage');
            const container = document.getElementById('ayahListContainer');
            container.innerHTML = '<p style="text-align:center">Membuka lembaran...</p>';
            
            try {
                const res = await fetch(`https://equran.id/api/v2/surat/${id}`);
                const json = await res.json();
                renderAyah(json.data.ayat);
            } catch (e) {
                console.warn("Fallback ke API Backup");
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/id.indonesian`);
                const json = await res.json();
                renderAyah(json.data.ayahs.map(a => ({ nomorAyat: a.numberInSurah, teksArab: a.text, teksIndonesia: a.text })));
            }
        }

        function renderAyah(ayahs) {
            document.getElementById('ayahListContainer').innerHTML = ayahs.map(a => `
                <div style="padding: 25px 0; border-bottom: 1px solid #eee;">
                    <div style="font-size: 28px; text-align: right; color: var(--primary); line-height: 2.2; margin-bottom: 10px;">${a.teksArab}</div>
                    <div style="font-size: 14px; color: #666;">${a.nomorAyat}. ${a.teksIndonesia}</div>
                </div>
            `).join('');
        }

        // DATA SURAH - HANYA CONTOH (PASTIKAN LIST LENGKAP KAMU TETAP ADA)
        const SURAH_LIST = [
            { id: 1, name: 'Al-Fatihah', arabic: 'الفاتحة' },
            { id: 18, name: 'Al-Kahf', arabic: 'الكهف' },
            { id: 36, name: 'Yasin', arabic: 'يس' },
            { id: 67, name: 'Al-Mulk', arabic: 'الملك' }
            // Tambahkan surah lainnya di sini
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Render Prayers
            document.getElementById('prayerList').innerHTML = PRAYERS.map(p => `
                <div class="prayer-item">
                    <div><div style="font-weight:700; color:var(--primary);">${p.name}</div><div style="font-size:12px; color:#999;">${p.time} WIB</div></div>
                    <div class="check-circle" onclick="this.classList.toggle('checked')"></div>
                </div>
            `).join('');

            // Render Quran List
            document.getElementById('surahListContainer').innerHTML = SURAH_LIST.map(s => `
                <div class="prayer-item" style="cursor:pointer;" onclick="openSurah(${s.id}, '${s.name}')">
                    <div style="font-weight:700;">${s.name}</div>
                    <div style="font-size:20px; color:var(--primary);">${s.arabic}</div>
                </div>
            `).join('');

            // Simple Timer
            setInterval(() => {
                document.getElementById('countdownTimer').innerText = new Date().toLocaleTimeString('id-ID');
            }, 1000);
        });
    </script>
</body>
</html>
