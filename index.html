<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Journey - Ibadah Harian</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #012248;
            --secondary: #d1b48c;
            --accent: #ff6b6b;
            --white: #ffffff;
            --gray: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--gray); color: #333; line-height: 1.6; }
        .container { max-width: 428px; margin: 0 auto; background: var(--white); min-height: 100vh; position: relative; padding-bottom: 90px; }

        /* Header Modern */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, #024073 100%);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .streak-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
        }

        /* Countdown Card ala Amaly */
        .countdown-card {
            background: var(--white);
            margin: -30px 20px 20px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .time-val { font-size: 38px; font-weight: 800; color: var(--primary); }
        .next-prayer { color: var(--secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 428px;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            z-index: 1000;
        }

        .nav-btn { flex: 1; text-align: center; color: #a4b0be; cursor: pointer; transition: 0.3s; font-size: 11px; }
        .nav-btn.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 3px; }

        /* Page System */
        .page { display: none; padding: 20px; animation: slideUp 0.3s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Prayer Row */
        .prayer-row {
            display: flex;
            align-items: center;
            background: var(--white);
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f1f2f6;
        }

        .check-box {
            width: 30px;
            height: 30px;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            margin-left: auto;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-box.done { background: var(--secondary); border-color: var(--secondary); }
        .check-box.done::after { content: '✓'; color: white; font-weight: bold; }

        /* Quran List */
        .surah-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: var(--white);
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid #f1f2f6;
        }

        .surah-no { width: 40px; font-weight: bold; color: var(--secondary); }
        
        /* Modal & Calendar */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day { padding: 10px 0; border-radius: 50%; font-size: 13px; }
        .cal-day.period { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="homePage" class="page active">
        <div class="app-header">
            <h1>Noor Journey</h1>
            <div class="streak-badge">🔥 <span id="streakCount">0</span> Hari Beruntun</div>
        </div>

        <div class="countdown-card">
            <div class="next-prayer" id="p-name">Memuat...</div>
            <div class="time-val" id="p-timer">00:00:00</div>
        </div>

        <h3 style="margin-bottom: 15px; color: var(--primary);">Jurnal Ibadah</h3>
        <div id="prayer-list"></div>
    </div>

    <div id="quranPage" class="page">
        <h2 style="margin-bottom: 20px; color: var(--primary);">Al-Quran</h2>
        <input type="text" id="qSearch" placeholder="Cari Surah..." style="width:100%; padding:15px; border-radius:15px; border:1px solid #eee; margin-bottom:20px;">
        <div id="surah-list"></div>
    </div>

    <div id="detailPage" class="page">
        <button onclick="navTo('quranPage')" style="border:none; background:none; color:var(--primary); font-weight:bold; cursor:pointer;">← Kembali</button>
        <h2 id="s-title" style="margin-top:15px; text-align:center; color:var(--primary);"></h2>
        <div id="ayah-list" style="margin-top:30px;"></div>
    </div>

    <div id="haidPage" class="page">
        <h2 style="margin-bottom: 20px; color: var(--primary);">Kalender Haid</h2>
        <div style="background: white; padding: 20px; border-radius: 20px; border: 1px solid #eee;">
            <div class="calendar" id="calendar"></div>
            <button onclick="alert('Fitur catat haid sedang disiapkan')" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; margin-top:20px; font-weight:bold;">+ Catat Haid</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-btn active" onclick="navTo('homePage')"><span class="nav-icon">🏠</span>Beranda</div>
        <div class="nav-btn" onclick="navTo('quranPage')"><span class="nav-icon">📖</span>Quran</div>
        <div class="nav-btn" onclick="navTo('haidPage')"><span class="nav-icon">🌙</span>Haid</div>
    </nav>
</div>

<script>
    const PRAYERS = [
        { id: 'subuh', name: 'Shubuh', time: '04:35' },
        { id: 'dzuhur', name: 'Dzuhur', time: '12:05' },
        { id: 'ashar', name: 'Ashar', time: '15:20' },
        { id: 'maghrib', name: 'Maghrib', time: '18:15' },
        { id: 'isya', name: 'Isya', time: '19:30' }
    ];

    // Navigation System
    function navTo(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.innerHTML.includes(pageId === 'homePage' ? 'Beranda' : pageId === 'quranPage' ? 'Quran' : 'Haid'));
        if(activeBtn) activeBtn.classList.add('active');
        window.scrollTo(0,0);
    }

    // Prayer List Logic
    function renderPrayers() {
        const list = document.getElementById('prayer-list');
        list.innerHTML = PRAYERS.map(p => `
            <div class="prayer-row">
                <div>
                    <div style="font-weight:700; color:var(--primary);">${p.name}</div>
                    <div style="font-size:12px; color:#a4b0be;">${p.time} WIB</div>
                </div>
                <div class="check-box" onclick="this.classList.toggle('done')"></div>
            </div>
        `).join('');
    }

    // Quran Logic with Fallback
    async function getSurahs() {
        try {
            const res = await fetch('https://equran.id/api/v2/surat');
            const data = await res.json();
            document.getElementById('surah-list').innerHTML = data.data.map(s => `
                <div class="surah-item" onclick="openSurah(${s.nomor})">
                    <div class="surah-no">${s.nomor}</div>
                    <div style="flex:1">
                        <div style="font-weight:700;">${s.namaLatin}</div>
                        <div style="font-size:11px; color:#a4b0be;">${s.arti} • ${s.jumlahAyat} Ayat</div>
                    </div>
                    <div style="font-size:20px; color:var(--primary); font-family: 'Amiri', serif;">${s.nama}</div>
                </div>
            `).join('');
        } catch (e) {
            console.error("API Error, please check connection.");
        }
    }

    async function openSurah(no) {
        navTo('detailPage');
        const container = document.getElementById('ayah-list');
        container.innerHTML = '<p style="text-align:center;">Membuka lembaran suci...</p>';
        
        try {
            const res = await fetch(`https://equran.id/api/v2/surat/${no}`);
            const data = await res.json();
            document.getElementById('s-title').innerText = data.data.namaLatin;
            container.innerHTML = data.data.ayat.map(a => `
                <div style="padding: 25px 0; border-bottom: 1px solid #eee;">
                    <div style="font-size: 28px; text-align: right; color: var(--primary); line-height: 2.2; margin-bottom: 15px;">${a.teksArab}</div>
                    <div style="font-size: 14px; color: #57606f;">${a.nomorAyat}. ${a.teksIndonesia}</div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = '<p>Gagal memuat. Periksa koneksi internet kamu.</p>';
        }
    }

    // Timer Logic
    function updateTimer() {
        const now = new Date();
        document.getElementById('p-timer').innerText = now.toLocaleTimeString('id-ID');
        document.getElementById('p-name').innerText = "Waktu Sekarang";
    }

    // Init
    window.onload = () => {
        renderPrayers();
        getSurahs();
        setInterval(updateTimer, 1000);
    };
</script>

</body>
</html>
